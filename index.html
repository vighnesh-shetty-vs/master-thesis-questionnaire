<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>AI and Business Decisions | Academic Survey</title><meta name="description" content="Academic questionnaire on AI-supported decision-making, available in English and French."><link rel="stylesheet" href="styles.css"></head><body>
<main class="container"><div class="top"><span class="brand">KEDGE · Master's Thesis Research</span><div><label class="lang-label" for="lang">Language / Langue</label> <select class="sel" id="lang" aria-label="Choose language"><option value="en">English</option><option value="fr">Français</option></select></div></div>
<header><span class="pill" id="duration">About 6–9 minutes</span><h1 id="page-title">AI-Supported Decision-Making in Organizations</h1><p class="sub" id="lead"></p></header>
<div id="not-configured" class="warn hidden" role="alert"></div>
<section class="card" id="privacy-card"><h2 id="intro-head"></h2><div class="privacy" id="privacy-text"></div><label class="choice" style="margin-top:17px"><input type="checkbox" id="consent"><span id="consent-label"></span></label></section>
<form id="survey" name="thesis-survey" novalidate><input type="hidden" name="form-name" value="thesis-survey"><input type="hidden" name="language" id="language-field" value="en"><input type="hidden" name="survey_version" id="version-field"><input type="hidden" name="consent" value="yes"><p class="hidden"><label>Leave blank <input name="website" tabindex="-1" autocomplete="off"></label></p>
<div class="card"><div class="stepMeta"><span id="step-label"></span><span id="step-count"></span></div><div class="progressTrack" aria-hidden="true"><div id="progress" class="progressFill"></div></div><h2 style="margin-top:19px" id="section-head"></h2><div id="questions"></div><div class="bottom"><button type="button" id="back" class="secondary"></button><button type="button" id="next" class="primary"></button><button type="submit" id="submit" class="primary hidden"></button></div><p id="msg" class="status" role="status" aria-live="polite"></p></div></form>
<section id="success" class="card hidden" role="status"><h2 id="thanks-title"></h2><p id="thanks-text"></p><a class="btn" href="interview.html" id="interview-link"></a><p class="quiet" id="separate-note" style="margin-top:16px"></p></section><footer class="foot" id="foot"></footer></main>
<script src="config.js"></script><script src="survey.js"></script></body></html>
