<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optional Follow-up Interview | Academic Research</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container"><div class="top"><a href="/">← <span id="return">Back to survey</span></a><select class="sel" id="lang" aria-label="Choose language"><option value="en">English</option><option value="fr">Français</option></select></div><div class="card"><h1 id="heading"></h1><p id="intro"></p><p class="privacy" id="privacy"></p><div class="warn hidden" id="not-configured"></div><form id="interview" name="thesis-interview" novalidate><input type="hidden" name="form-name" value="thesis-interview"><input type="hidden" name="language" id="language-field" value="en"><p class="hidden"><label>Leave blank <input name="website" tabindex="-1" autocomplete="off"></label></p><div class="question"><label class="qtitle" for="name" id="name-label"></label><input id="name" name="preferred_name" type="text" autocomplete="given-name" maxlength="100"></div><div class="question"><label class="qtitle" for="email" id="email-label"></label><input id="email" name="email" type="email" autocomplete="email" required maxlength="150"></div><div class="question"><label class="qtitle" for="format" id="format-label"></label><select class="sel" name="preferred_format" id="format" style="width:100%;max-width:none"></select></div><div class="question"><label class="qtitle" for="topic" id="topic-label"></label><textarea id="topic" name="discussion_topic" maxlength="2000"></textarea></div><label class="choice"><input name="contact_consent" id="consent" type="checkbox" value="yes" required><span id="consent-label"></span></label><button id="submit" type="submit" class="primary"></button><p class="status" id="msg" role="status" aria-live="polite"></p></form><div id="success" class="hidden"><h2 id="thanks"></h2></div></div></main><script src="/config.js"></script><script src="/interview.js"></script></body></html>
